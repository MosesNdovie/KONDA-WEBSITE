<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="Konda YouthNet and Family Health — supporting young people, families, and communities.">

  <title>KONDA | YouthNet & Family Health</title>

  <style>
    :root {
      --green: #175b43;
      --dark: #143b2e;
      --lime: #e6edaf;
      --cream: #f6f7f1;
      --white: #fff;
      --text: #243c32;
      --muted: #617168;
      --line: #dce3d9;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--cream);
    }

    a { color: inherit; }
    button { font: inherit; }
    img { display: block; max-width: 100%; }
    [hidden] { display: none !important; }

    .container {
      width: min(1180px, calc(100% - 40px));
      margin-inline: auto;
    }

    .skip-link {
      position: absolute;
      top: -80px;
      left: 15px;
      z-index: 100;
      padding: 14px;
      background: white;
      color: var(--dark);
    }

    .skip-link:focus { top: 10px; }

    a:focus-visible,
    button:focus-visible,
    summary:focus-visible {
      outline: 3px solid #bc9230;
      outline-offset: 5px;
    }

    /* Navigation */
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: white;
      border-bottom: 1px solid var(--line);
    }

    .nav {
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo {
      width: 54px;
      height: 54px;
      object-fit: contain;
    }

    .brand-name {
      display: block;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--green);
    }

    .brand-description {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .nav-links a:hover { color: var(--green); }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 23px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: var(--green);
      color: white;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background .2s ease;
    }

    .button:hover { background: var(--dark); }

    .button-light {
      background: var(--lime);
      color: var(--dark);
    }

    .button-light:hover { background: white; }

    .button-outline {
      border-color: #ffffff70;
      background: transparent;
      color: white;
    }

    .button-outline:hover {
      background: #ffffff15;
    }

    .menu-button {
      display: none;
      padding: 10px 14px;
      background: white;
      color: var(--green);
      border: 1px solid var(--line);
      border-radius: 3px;
      cursor: pointer;
    }

    /* Hero */
    .hero {
      position: relative;
      overflow: hidden;
      background: var(--dark);
      color: white;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      min-height: 610px;
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      align-self: center;
      padding: 76px 52px 76px 0;
    }

    .eyebrow {
      margin: 0 0 20px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green);
    }

    .hero .eyebrow { color: var(--lime); }

    h1 {
      margin: 0;
      font-size: clamp(44px, 5.8vw, 76px);
      line-height: 1.04;
      letter-spacing: -3px;
    }

    .hero-copy > p:not(.eyebrow) {
      max-width: 490px;
      margin: 26px 0;
      color: #d5e2da;
      font-size: 18px;
      line-height: 1.75;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .hero-visual {
      position: relative;
      min-height: 460px;
      background:
        radial-gradient(circle at 80% 20%, #729c58, transparent 55%),
        linear-gradient(135deg, #376c4d, #1c4637);
    }

    .hero-visual > img {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      object-fit: cover;
    }

    .hero-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #102d24c9, transparent 65%);
    }

    .hero-caption {
      position: absolute;
      z-index: 1;
      left: 30px;
      right: 30px;
      bottom: 34px;
      border-left: 3px solid var(--lime);
      padding-left: 18px;
    }

    .hero-caption strong {
      display: block;
      font-size: 25px;
      line-height: 1.3;
    }

    .hero-caption span {
      display: block;
      margin-top: 9px;
      color: #dfebe2;
      font-size: 14px;
    }

    /* Mission strip */
    .mission-strip {
      background: var(--lime);
      padding: 27px 0;
    }

    .mission-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .mission-item {
      padding: 5px 28px;
      border-right: 1px solid #173e2c30;
    }

    .mission-item:first-child { padding-left: 0; }
    .mission-item:last-child { border-right: 0; }

    .mission-item strong {
      display: block;
      margin-bottom: 7px;
      font-size: 20px;
    }

    .mission-item span {
      color: #486044;
      font-size: 14px;
      line-height: 1.6;
    }

    /* Shared sections */
    .section { padding: 85px 0; }

    .section-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 38px;
    }

    h2 {
      margin: 0;
      font-size: clamp(32px, 4.5vw, 52px);
      line-height: 1.12;
      letter-spacing: -1.7px;
    }

    .section-intro {
      max-width: 620px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
    }

    /* Numbered program cards */
    .program-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .program-card {
      position: relative;
      padding: 30px;
      background: white;
      border: 1px
